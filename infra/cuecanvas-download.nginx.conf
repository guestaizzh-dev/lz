# Append to the existing shared TLS gateway. Keep all other host configurations.
server {
  listen 80;
  server_name cuecanvas.top;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 308 https://cuecanvas.top$request_uri; }
}
server {
  listen 443 ssl;
  server_name cuecanvas.top;
  ssl_certificate /etc/nginx/ssl/cuecanvas.top.pem;
  ssl_certificate_key /etc/nginx/ssl/cuecanvas.top.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $academy_download daoxue-edge;
  location = / { return 302 /download/; }
  location = /download { return 301 /download/; }
  location ^~ /download/ {
    proxy_pass http://$academy_download:80$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location / { return 404; }
}
