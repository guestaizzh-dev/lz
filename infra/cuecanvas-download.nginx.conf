# Append to the existing shared TLS gateway. Keep all other host configurations.
server {
  listen 80;
  server_name cuecanvas.top;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 308 https://cuecanvas.top$request_uri; }
}
server {
  listen 443 ssl;
  server_name cuecanvas.top;
  ssl_certificate /etc/nginx/ssl/cuecanvas.top.pem;
  ssl_certificate_key /etc/nginx/ssl/cuecanvas.top.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Frame-Options DENY always;
  client_max_body_size 105m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $academy_download daoxue-edge;
  location = / { return 302 /download/; }
  location = /download { return 301 /download/; }
  location = /api/v1/live/socket {
    proxy_pass http://$academy_download:80$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location = /api/v1/media/stream {
    proxy_pass http://$academy_download:80$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 120s;
  }
  location ^~ /api/v1/admin/media/uploads {
    proxy_pass http://$academy_download:80$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 9m;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location = /api/v1/live/player {
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_pass http://$academy_download:80$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location ^~ /download/ {
    proxy_pass http://$academy_download:80$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://$academy_download:80$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
}
