# Append to the existing platform gateway after backing up its configuration.
server {
  listen 443 ssl;
  server_name academy.43-160-229-173.sslip.io;
  ssl_certificate /etc/nginx/ssl/daoxue-academy.pem;
  ssl_certificate_key /etc/nginx/ssl/daoxue-academy.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Frame-Options DENY always;
  client_max_body_size 105m;
  # Resolve again after an academy container is replaced.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $academy_edge daoxue-edge;
  location = /api/v1/live/socket {
    proxy_pass http://$academy_edge:80$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location = /api/v1/media/stream {
    proxy_pass http://$academy_edge:80$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 120s;
  }
  location ^~ /api/v1/admin/media/uploads {
    proxy_pass http://$academy_edge:80$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 9m;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location = /api/v1/live/player {
    # The player's own CSP scopes framing to the approved academy origins.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_pass http://$academy_edge:80$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://$academy_edge:80$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
}
