server {
  listen 80;
  server_name _;
  absolute_redirect off;
  # The host's TLS gateway is the sole public ingress on this private network.
  set_real_ip_from 172.18.0.3;
  real_ip_header X-Forwarded-For;
  root /srv/admin;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  include /etc/nginx/snippets/api-proxy.conf;
  location = /download { return 301 /download/; }
  location = /download/android.apk {
    alias /srv/download/current/android.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="daoxue-academy.apk"';
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location ^~ /download/ {
    alias /srv/download/current/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    types { text/html html; text/css css; application/javascript js; application/json json; image/png png; image/svg+xml svg; application/vnd.android.package-archive apk; }
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
