server {
  listen 80;
  server_name _;
  absolute_redirect off;
  # The host's TLS gateway is the sole public ingress on this private network.
  set_real_ip_from 172.18.0.3;
  real_ip_header X-Forwarded-For;
  root /srv/admin;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  include /etc/nginx/snippets/api-proxy.conf;
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
