packages:
  - apps/admin
  - services/api
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  core-js: false
  core-js-pure: false
  es5-ext: false
  zego-express-engine-webrtc: false
overrides:
  '@umijs/max>antd': 6.6.0
  '@umijs/plugins>@ant-design/pro-components': 3.1.14-2
  '@umijs/plugins>@tanstack/react-query': 5.101.2
  '@types/react': 19.2.17
  # Security fixes for transitive request/upload/payment and Prisma tooling dependencies.
  'deepmerge-ts@<8.0.0': 8.0.0
  'urllib@>=3.0.0 <=4.9.0': 4.9.1
  'mysql2@<3.23.1': 3.23.1
  'js-yaml@>=5.0.0 <=5.4.0': 5.4.1
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'qs@>=6.7.0 <=6.16.0': 6.16.1
